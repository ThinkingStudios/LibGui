	 */
}

repositories {
	maven {
		url "https://server.bbkr.space/artifactory/libs-release"
		content {
			includeGroup "io.github.cottonmc"
		}
	}
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
	maven { url "https://jitpack.io" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
		mappings "dev.architectury:yarn-mappings-patch-neoforge:${project.yarn_patch}"
	}
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	forgeRuntimeLibrary(implementation(include("blue.endless:jankson:1.2.3")))

	include api("com.github.TexBlock:LibNinePatch:master-SNAPSHOT")

	// Test mod dependencies
	//testModImplementation sourceSets.main.output
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

java {
	withSourcesJar()
	withJavadocJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	options.encoding = "UTF-8"
	options.release = 21
}

jar {
	from "CREDITS.txt", "LICENSE"
}

def javadocBuildJar = tasks.register('javadocBuildJar', Jar) {
	destinationDirectory = file('build/devlibs')
	archiveClassifier = 'javadoc-build'
	from sourceSets.javadoc.output
}

javadoc {
	dependsOn javadocBuildJar

	options {
		links "https://maven.fabricmc.net/docs/yarn-$project.yarn_mappings"
		links 'https://javadoc.io/doc/org.jetbrains/annotations/19.0.0'
		taglets 'io.github.cottonmc.cotton.gui.jd.ExperimentalTaglet',
				'io.github.cottonmc.cotton.gui.jd.PropertyTaglet'
		tagletPath javadocBuildJar.get().archiveFile.get().asFile
	}

	exclude("**/impl/**")
}

// configure the maven publication
publishing {
	publications {
		maven(MavenPublication) {
			from components.java
			pom {
				name = "LibGuiFoxified"
				description = "Minecraft GUI Library"
				url = "https://github.com/ThinkingStudios/LibGuiFoxified"
				licenses {
					license {
						name = "MIT"
						url = "https://github.com/ThinkingStudios/LibGuiFoxified/blob/HEAD/LICENSE"
					}
				}
				developers {
					developer {
						name = "ThinkingStudio"
						url = "https://github.com/ThinkingStudios"
					}
				}
			}
		}
	}

	// select the repositories you want to publish to
	repositories {
		maven {
			name = "cloudsmith"
			url = "https://maven.cloudsmith.io/thinkingstudio/libguifoxified/"
			def releasesRepoUrl = "https://maven.cloudsmith.io/thinkingstudio/libguifoxified/"
			def snapshotsRepoUrl = "https://maven.cloudsmith.io/thinkingstudio/libguifoxified/"
			url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
			credentials {
				username = 'tex-true'
				password = System.getenv("CLOUDSMITH_MAVEN_TOKEN")
			}
		}
	}
}
